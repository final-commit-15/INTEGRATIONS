# Alembic configuration for agentforge-integrations.
# The database URL is overridden at runtime by alembic/env.py from
# settings (settings.database_url). This placeholder is only used before
# env.py runs, so it can stay empty/neutral.
[alembic]
script_location = alembic
prepend_sys_path = . src
# sqlalchemy.url is intentionally left as a placeholder; env.py builds the
# engine from config.settings.
sqlalchemy.url =

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
