version: '3.8'

services:
  webhooks:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - agentforge-net

  # Optional: Redis for rate limiting (if needed)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agentforge-net
    restart: unless-stopped

networks:
  agentforge-net:
    driver: bridge