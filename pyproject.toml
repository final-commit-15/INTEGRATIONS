[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-integrations"
version = "1.0.0"
description = "AgentForge Integrations - Enterprise OAuth, provider execution, webhooks, and credential management microservice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AgentForge Platform" }]
keywords = ["fastapi", "integrations", "oauth", "webhooks", "saas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "authlib>=1.3.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "aioboto3>=13.0.0",
    "motor>=3.4.0",
    "aiomysql>=0.2.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "types-python-jose>=3.3.4",
    "types-redis>=4.6.0",
    "types-requests>=2.32.0",
    "aiosqlite>=0.20.0",
]
prod = [
    "gunicorn>=22.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "api: API endpoint tests",
    "unit: unit tests",
    "provider: provider execution tests",
    "integration: tests requiring external services",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
explicit_package_bases = true
exclude = ["alembic/", "docs/", ".venv/"]

[[tool.mypy.overrides]]
module = ["celery.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic", "docs", "agentforge-integrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ARG",
    "PERF", "ASYNC", "S",
]
ignore = ["S101", "S311", "B008"]
per-file-ignores = { "tests/*" = ["S", "E501"], "src/providers/*" = ["S105"] }

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "agentforge-integrations"

[tool.cov]
run = { branch = true, source = ["src"] }
report = { show_missing = true, skip_covered = true, fail_under = 80 }

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true